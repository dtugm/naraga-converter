# Standalone dev stack for this service.
#   cp .env.example .env && docker compose up
services:
  converter:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:8085:8085"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./src:/app/src:ro
      # Durable job state: survives container restarts, so the callback outbox
      # and job idempotency behave like production.
      - state:/app/data
      # Per-job scratch space (CONVERTER_STAGING_ROOT, default /tmp/naraga-converter).
      # Named volume so scratch survives a container restart mid-job like state does.
      - staging:/tmp/naraga-converter
      # Bind mount for local test fixtures: drop sample inputs in ./data-io on the
      # host and reference them (e.g. as input_paths) from inside the container at
      # /data. Not used by the app itself — purely a convenience for manual testing.
      - ./data-io:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  state:
  staging:
