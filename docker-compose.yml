# Standalone dev stack for this service.
#   cp .env.example .env && docker compose up
services:
  converter:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:8085:8085"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./src:/app/src:ro
      # Durable job state: survives container restarts, so the callback outbox
      # and job idempotency behave like production.
      - state:/app/data
      # Per-job scratch space (CONVERTER_STAGING_ROOT, default /tmp/naraga-converter).
      # Named volume so scratch survives a container restart mid-job like state does.
      - staging:/tmp/naraga-converter
      # Manual testing only (not used by the app): inputs/outputs for converter.cli
      # live in ./data-io (= /data), and the smoke script + fixture generator are
      # mounted so `docker compose run --rm converter bash scripts/smoke_conversions.sh` works.
      - ./data-io:/data
      - ./scripts:/app/scripts:ro
      - ./tests:/app/tests:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  state:
  staging:
